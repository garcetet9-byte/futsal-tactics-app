<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Futsal Tactics Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#111;font-family:Arial;overflow:hidden;color:white;}
header{background:linear-gradient(90deg,#4e73df,#6f42c1);padding:8px 15px;}
.toolbar{background:#2b2b2b;padding:6px;display:flex;flex-wrap:wrap;gap:5px;}
button{padding:5px 10px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;}
canvas{display:block;background:#197a1f;}
</style>
</head>
<body>

<header>⚽ Futsal Tactics Pro</header>

<div class="toolbar">
<button onclick="mode='select'">Seleccionar</button>
<button onclick="mode='arrow'">Flecha</button>
<button onclick="addPlayer('jugador')">+ Jugador</button>
<button onclick="addPlayer('arquero')">+ Arquero</button>
<button onclick="addCone()">+ Cono</button>
<button onclick="addBall()">+ Pelota</button>
<button onclick="toggleTactic()">Modo Ofensivo/Defensivo</button>
<button onclick="animatePlay()">▶ Animar</button>
<button onclick="deleteSelectedArrow()">Borrar flecha</button>
<button onclick="savePlay()">Guardar</button>
<button onclick="loadPlay()">Cargar</button>
</div>

<canvas id="board"></canvas>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight-80;
render();
}
window.addEventListener("resize",resize);
resize();

let mode="select";
let players=[], arrows=[], cones=[], balls=[];
let dragging=null;
let selectedArrow=null;
let arrowFrom=null;
let arrowStart=null;
let scale=1;
let tacticMode="ofensivo";

/* ================= FIELD ================= */
function drawField(){
const W=1000;
const H=600;
const areaR=110;
const goalH=180;

ctx.fillStyle="#197a1f";
ctx.fillRect(-2000,-2000,4000,4000);

ctx.strokeStyle="white";
ctx.lineWidth=4;

// borde cancha
ctx.strokeRect(-W/2,-H/2,W,H);

// linea central
ctx.beginPath();
ctx.moveTo(0,-H/2);
ctx.lineTo(0,H/2);
ctx.stroke();

// circulo central
ctx.beginPath();
ctx.arc(0,0,80,0,Math.PI*2);
ctx.stroke();

// áreas
ctx.beginPath();
ctx.arc(-W/2,0,areaR,-Math.PI/2,Math.PI/2);
ctx.stroke();

ctx.beginPath();
ctx.arc(W/2,0,areaR,Math.PI/2,-Math.PI/2);
ctx.stroke();

// arcos
ctx.strokeRect(-W/2-15,-goalH/2,15,goalH);
ctx.strokeRect(W/2,-goalH/2,15,goalH);

// números tácticos
ctx.font="30px Arial";
ctx.fillStyle="rgba(255,255,255,0.35)";
ctx.fillText("1",-W/4,-H/4);
ctx.fillText("2",W/4,-H/4);
ctx.fillText("3",-W/4,H/4);
ctx.fillText("4",W/4,H/4);
}

/* ================= PLAYERS ================= */
function drawPlayer(p){
ctx.save();
ctx.translate(p.x,p.y);

const color=p.team==="A"?"#2196f3":"#ff4d4d";

ctx.beginPath();
ctx.arc(0,-20,7,0,Math.PI*2);
ctx.fillStyle="#f1c27d";
ctx.fill();

ctx.strokeStyle=p.role==="arquero"?"#ffc107":color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.moveTo(0,-13);
ctx.lineTo(0,15);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(-10,0);
ctx.lineTo(10,0);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,15);
ctx.lineTo(-7,30);
ctx.moveTo(0,15);
ctx.lineTo(7,30);
ctx.stroke();

ctx.fillStyle="white";
ctx.font="13px Arial";
ctx.textAlign="center";
ctx.fillText(p.name,0,45);

ctx.restore();
}

/* ================= CONES ================= */
function drawCones(){
cones.forEach(c=>{
ctx.fillStyle="orange";
ctx.beginPath();
ctx.moveTo(c.x,c.y);
ctx.lineTo(c.x-10,c.y+25);
ctx.lineTo(c.x+10,c.y+25);
ctx.closePath();
ctx.fill();
});
}

/* ================= BALLS ================= */
function drawBalls(){
balls.forEach(b=>{
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(b.x,b.y,8,0,Math.PI*2);
ctx.fill();
});
}

/* ================= ARROWS ================= */
function drawArrows(){
arrows.forEach(a=>{
ctx.strokeStyle=(a===selectedArrow)?"red":(a.team==="A"?"cyan":"yellow");
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(a.from.x,a.from.y);
ctx.lineTo(a.to.x,a.to.y);
ctx.stroke();

const ang=Math.atan2(a.to.y-a.from.y,a.to.x-a.from.x);
ctx.beginPath();
ctx.moveTo(a.to.x,a.to.y);
ctx.lineTo(a.to.x-15*Math.cos(ang-Math.PI/6),a.to.y-15*Math.sin(ang-Math.PI/6));
ctx.lineTo(a.to.x-15*Math.cos(ang+Math.PI/6),a.to.y-15*Math.sin(ang+Math.PI/6));
ctx.fillStyle=(a===selectedArrow)?"red":(a.team==="A"?"cyan":"yellow");
ctx.fill();
});
}

/* ================= RENDER ================= */
function render(){
ctx.save();
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.translate(canvas.width/2,canvas.height/2);
ctx.scale(scale,scale);

drawField();
drawArrows();
drawCones();
drawBalls();
players.forEach(drawPlayer);

ctx.restore();
}

/* ================= INTERACTION ================= */
canvas.addEventListener("mousedown",e=>{
const r=canvas.getBoundingClientRect();
const x=(e.clientX-r.left-canvas.width/2)/scale;
const y=(e.clientY-r.top-canvas.height/2)/scale;

// seleccionar flecha
selectedArrow=arrows.find(a=>{
const dx=a.to.x-a.from.x;
const dy=a.to.y-a.from.y;
const len=Math.hypot(dx,dy);
const dist=Math.abs(dy*x-dx*y+a.to.x*a.from.y-a.to.y*a.from.x)/len;
return dist<8;
});
if(selectedArrow){render();return;}

// arrastrar conos
dragging=players.find(p=>Math.hypot(p.x-x,p.y-y)<25)
|| cones.find(c=>Math.hypot(c.x-x,c.y-y)<20)
|| balls.find(b=>Math.hypot(b.x-x,b.y-y)<20);

if(mode==="arrow"){
arrowFrom=players.find(p=>Math.hypot(p.x-x,p.y-y)<25);
if(arrowFrom) arrowStart={x:arrowFrom.x,y:arrowFrom.y};
}
});

canvas.addEventListener("mousemove",e=>{
if(dragging){
const r=canvas.getBoundingClientRect();
dragging.x=(e.clientX-r.left-canvas.width/2)/scale;
dragging.y=(e.clientY-r.top-canvas.height/2)/scale;
render();
}
});

canvas.addEventListener("mouseup",e=>{
dragging=null;
if(mode==="arrow" && arrowFrom){
const r=canvas.getBoundingClientRect();
const x=(e.clientX-r.left-canvas.width/2)/scale;
const y=(e.clientY-r.top-canvas.height/2)/scale;
arrows.push({playerId:arrowFrom.id,team:arrowFrom.team,from:arrowStart,to:{x,y}});
arrowFrom=null;
render();
}
});

canvas.addEventListener("wheel",e=>{
e.preventDefault();
scale+=e.deltaY*-0.001;
scale=Math.min(Math.max(scale,0.5),2);
render();
});

/* ================= FUNCTIONS ================= */
function deleteSelectedArrow(){
if(!selectedArrow) return;
arrows=arrows.filter(a=>a!==selectedArrow);
selectedArrow=null;
render();
}

function animatePlay(){
arrows.forEach(a=>{
const p=players.find(pl=>pl.id===a.playerId);
if(!p) return;
let t=0;
function step(){
t+=0.02;
p.x=a.from.x+(a.to.x-a.from.x)*t;
p.y=a.from.y+(a.to.y-a.from.y)*t;
render();
if(t<1) requestAnimationFrame(step);
}
step();
});
}

function toggleTactic(){
tacticMode=tacticMode==="ofensivo"?"defensivo":"ofensivo";
players.forEach(p=>{
if(tacticMode==="defensivo") p.y+=80;
else p.y-=80;
});
render();
}

function savePlay(){
localStorage.setItem("futsalPro",JSON.stringify({players,arrows,cones,balls}));
alert("Guardado");
}

function loadPlay(){
const d=JSON.parse(localStorage.getItem("futsalPro"));
if(!d) return;
players=d.players;
arrows=d.arrows;
cones=d.cones;
balls=d.balls;
render();
}

function addPlayer(role){
const name=prompt("Nombre");
const team=prompt("Equipo A o B").toUpperCase();
if(!name||!["A","B"].includes(team)) return;
players.push({id:crypto.randomUUID(),x:0,y:0,name,role,team});
render();
}

function addCone(){cones.push({x:0,y:0});render();}
function addBall(){balls.push({x:0,y:0});render();}

render();
</script>
</body>
</html>
