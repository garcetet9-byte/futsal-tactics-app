<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Futsal Tactics Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; background:#1e1e1e; color:white; font-family:Arial }
header { padding:12px 20px; background:linear-gradient(90deg,#4e73df,#6f42c1); font-size:20px }
.toolbar { padding:10px; background:#2b2b2b }
button { margin-right:6px; padding:6px 12px; border:none; border-radius:6px; cursor:pointer; font-weight:bold }
.select{background:#4e73df;color:white}
.arrow{background:#ffc107;color:black}
.save{background:#20c997;color:black}
.load{background:#6f42c1;color:white}
.clear{background:#dc3545;color:white}
.container{display:flex}
canvas{margin:10px;border:3px solid #0f4d0f;border-radius:10px;background:#1f7a1f}
.sidebar{width:240px;background:#2b2b2b;padding:10px}
.player-btn{width:100%;margin-bottom:6px;background:#4e73df;color:white}
</style>
</head>

<body>

<header>⚽ Futsal Tactics Pro</header>

<div class="toolbar">
  <button class="select" onclick="mode='select'">Seleccionar</button>
  <button class="arrow" onclick="mode='arrow'">Flecha</button>
  <button onclick="animatePlay()">▶ Animar</button>
  <button class="save" onclick="savePlay()">Guardar</button>
  <button class="load" onclick="loadPlay()">Cargar</button>
  <button class="clear" onclick="clearBoard()">Limpiar</button>
</div>

<div class="container">
  <canvas id="board" width="1000" height="600"></canvas>

  <div class="sidebar">
    <h3>Jugadores</h3>
    <button class="player-btn" onclick="addPlayer('jugador')">+ Jugador</button>
    <button class="player-btn" onclick="addPlayer('arquero')" style="background:#ffc107;color:black">
      + Arquero
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let mode = "select";
let players = [];
let arrows = [];
let selectedPlayer = null;
let drawingArrow = false;
let startX, startY;

/* ===== ZOOM & ROTACION ===== */
let scale = 1;
let rotation = 0;

/* ===== CAMPO ===== */
function drawField() {
  ctx.fillStyle = "#1f7a1f";
  ctx.fillRect(-500, -300, 1000, 600);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.strokeRect(-480, -280, 960, 560);

  ctx.beginPath();
  ctx.moveTo(0, -280);
  ctx.lineTo(0, 280);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, 70, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeRect(-480, -80, 40, 160);
  ctx.strokeRect(440, -80, 40, 160);
}

/* ===== PERSONITAS ===== */
function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  const color = p.team === "A" ? "#007bff" : "#ff4d4d";

  // cabeza
  ctx.beginPath();
  ctx.arc(0, -18, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#f1c27d";
  ctx.fill();

  // cuerpo
  ctx.strokeStyle = p.role === "arquero" ? "#ffc107" : color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(0, 10);
  ctx.stroke();

  // brazos
  ctx.beginPath();
  ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
  ctx.stroke();

  // piernas
  ctx.beginPath();
  ctx.moveTo(0, 10); ctx.lineTo(-6, 22);
  ctx.moveTo(0, 10); ctx.lineTo(6, 22);
  ctx.stroke();

  ctx.fillStyle = "white";
  ctx.font = "12px Arial";
  ctx.textAlign = "center";
  ctx.fillText(p.name, 0, 36);

  ctx.restore();
}

/* ===== FLECHAS ===== */
function drawArrows() {
  arrows.forEach(a => {
    const color = a.team === "A" ? "cyan" : "yellow";
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(a.from.x, a.from.y);
    ctx.lineTo(a.to.x, a.to.y);
    ctx.stroke();

    const angle = Math.atan2(a.to.y - a.from.y, a.to.x - a.from.x);
    const h = 14;
    ctx.beginPath();
    ctx.moveTo(a.to.x, a.to.y);
    ctx.lineTo(a.to.x - h * Math.cos(angle - Math.PI/6),
               a.to.y - h * Math.sin(angle - Math.PI/6));
    ctx.lineTo(a.to.x - h * Math.cos(angle + Math.PI/6),
               a.to.y - h * Math.sin(angle + Math.PI/6));
    ctx.fillStyle = color;
    ctx.fill();
  });
}

/* ===== RENDER ===== */
function render() {
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(scale, scale);
  ctx.rotate(rotation);

  drawField();
  drawArrows();
  players.forEach(drawPlayer);

  ctx.restore();
}

/* ===== JUGADORES ===== */
function addPlayer(role) {
  const name = prompt("Nombre:");
  const team = prompt("Equipo A o B").toUpperCase();
  if (!name || !["A","B"].includes(team)) return;

  players.push({
    id: crypto.randomUUID(),
    x: 0, y: 0,
    name, role, team
  });
  render();
}

/* ===== INTERACCION ===== */
canvas.addEventListener("mousedown", e => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left - canvas.width/2) / scale;
  const y = (e.clientY - r.top - canvas.height/2) / scale;

  if (mode === "select") {
    selectedPlayer = players.find(p => Math.hypot(p.x - x, p.y - y) < 20);
  }
  if (mode === "arrow" && selectedPlayer) {
    drawingArrow = true;
    startX = selectedPlayer.x;
    startY = selectedPlayer.y;
  }
});

canvas.addEventListener("mousemove", e => {
  if (selectedPlayer && mode === "select") {
    const r = canvas.getBoundingClientRect();
    selectedPlayer.x = (e.clientX - r.left - canvas.width/2) / scale;
    selectedPlayer.y = (e.clientY - r.top - canvas.height/2) / scale;
    render();
  }
});

canvas.addEventListener("mouseup", e => {
  if (drawingArrow && selectedPlayer) {
    const r = canvas.getBoundingClientRect();
    arrows.push({
      playerId: selectedPlayer.id,
      team: selectedPlayer.team,
      from: { x:startX, y:startY },
      to: {
        x:(e.clientX - r.left - canvas.width/2)/scale,
        y:(e.clientY - r.top - canvas.height/2)/scale
      }
    });
    drawingArrow = false;
    render();
  }
});

/* ===== ZOOM & ROTACION ===== */
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.altKey) rotation += e.deltaY * 0.001;
  else scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(scale, 0.5), 2);
  render();
});

/* ===== ANIMACION ===== */
function animatePlay() {
  arrows.forEach(a => {
    const p = players.find(pl => pl.id === a.playerId);
    if (!p) return;
    let t = 0;
    function step(){
      t+=0.02;
      p.x = a.from.x + (a.to.x-a.from.x)*t;
      p.y = a.from.y + (a.to.y-a.from.y)*t;
      render();
      if(t<1) requestAnimationFrame(step);
    }
    step();
  });
}

/* ===== GUARDAR ===== */
function savePlay(){
  localStorage.setItem("futsalPro",JSON.stringify({players,arrows}));
  alert("Jugada guardada");
}
function loadPlay(){
  const d = JSON.parse(localStorage.getItem("futsalPro"));
  if(!d) return alert("No hay jugada");
  players=d.players; arrows=d.arrows; render();
}
function clearBoard(){ players=[]; arrows=[]; render(); }

render();
</script>
</body>
</html>
