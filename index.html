<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Futsal Tactics Pro</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
  }

  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 42px;
    background: linear-gradient(90deg,#4e6bd8,#7b4bd8);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    z-index: 10;
  }

  button {
    padding: 5px 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  canvas {
    display: block;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="mode='select'">Seleccionar</button>
  <button onclick="mode='player'">+ Jugador</button>
  <button onclick="mode='goalie'">+ Arquero</button>
  <button onclick="mode='cone'">+ Cono</button>
  <button onclick="mode='ball'">+ Pelota</button>
  <button onclick="mode='arrow'">Flecha</button>
  <button onclick="animate()">▶ Animar</button>
  <button onclick="deleteArrow()">🗑 Flecha</button>
  <button onclick="savePlay()">💾 Guardar</button>
  <button onclick="loadPlay()">📂 Cargar</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let scale = 1;
let offsetX = canvas.width / 2;
let offsetY = canvas.height / 2;

let mode = "select";
let dragging = null;
let arrows = [];
let arrowTemp = null;
let selectedArrow = null;

const objects = [];

function worldPos(x,y){
  return {
    x:(x-offsetX)/scale,
    y:(y-offsetY)/scale
  }
}

/* ================== CANCHA ================== */
function drawField(){
  const W = 1000;
  const H = 600;
  const areaR = 120;
  const goalH = 200;

  ctx.fillStyle = "#197a1f";
  ctx.fillRect(-W/2-300,-H/2-300,W+600,H+600);

  ctx.strokeStyle="white";
  ctx.lineWidth=4;

  ctx.strokeRect(-W/2,-H/2,W,H);

  ctx.beginPath();
  ctx.moveTo(0,-H/2);
  ctx.lineTo(0,H/2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0,0,80,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(-W/2,0,areaR,-Math.PI/2,Math.PI/2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(W/2,0,areaR,Math.PI/2,-Math.PI/2);
  ctx.stroke();

  ctx.strokeRect(-W/2-20,-goalH/2,20,goalH);
  ctx.strokeRect(W/2,-goalH/2,20,goalH);

  ctx.fillStyle="rgba(255,255,255,0.35)";
  ctx.font="28px Arial";
  ctx.textAlign="center";
  ctx.fillText("1",-250,-150);
  ctx.fillText("2",250,-150);
  ctx.fillText("3",-250,150);
  ctx.fillText("4",250,150);
}

/* ================== OBJETOS ================== */
function drawObjects(){
  objects.forEach(o=>{
    if(o.type==="player" || o.type==="goalie"){
      ctx.fillStyle=o.color;
      ctx.beginPath();
      ctx.arc(o.x,o.y,12,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(o.x,o.y-14,7,0,Math.PI*2);
      ctx.fill();
    }
    if(o.type==="cone"){
      ctx.fillStyle="orange";
      ctx.beginPath();
      ctx.moveTo(o.x,o.y);
      ctx.lineTo(o.x-10,o.y+20);
      ctx.lineTo(o.x+10,o.y+20);
      ctx.fill();
    }
    if(o.type==="ball"){
      ctx.fillStyle="white";
      ctx.beginPath();
      ctx.arc(o.x,o.y,6,0,Math.PI*2);
      ctx.fill();
    }
  });
}

/* ================== FLECHAS ================== */
function drawArrows(){
  arrows.forEach(a=>{
    ctx.strokeStyle=a===selectedArrow?"yellow":"red";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(a.x1,a.y1);
    ctx.lineTo(a.x2,a.y2);
    ctx.stroke();
  });
}

function deleteArrow(){
  if(selectedArrow){
    arrows = arrows.filter(a=>a!==selectedArrow);
    selectedArrow=null;
  }
}

/* ================== RENDER ================== */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.translate(offsetX,offsetY);
  ctx.scale(scale,scale);

  drawField();
  drawArrows();
  drawObjects();
}
render();

/* ================== EVENTOS ================== */
canvas.onmousedown=e=>{
  const p=worldPos(e.clientX,e.clientY);

  if(mode==="player"){
    objects.push({type:"player",x:p.x,y:p.y,color:"blue"});
  }
  if(mode==="goalie"){
    objects.push({type:"goalie",x:p.x,y:p.y,color:"lime"});
  }
  if(mode==="cone"){
    objects.push({type:"cone",x:p.x,y:p.y});
  }
  if(mode==="ball"){
    objects.push({type:"ball",x:p.x,y:p.y});
  }

  if(mode==="arrow"){
    arrowTemp={x1:p.x,y1:p.y,x2:p.x,y2:p.y};
    arrows.push(arrowTemp);
  }

  objects.forEach(o=>{
    if(Math.hypot(o.x-p.x,o.y-p.y)<15){
      dragging=o;
    }
  });

  arrows.forEach(a=>{
    const d=Math.hypot(a.x1-p.x,a.y1-p.y);
    if(d<10) selectedArrow=a;
  });
};

canvas.onmousemove=e=>{
  const p=worldPos(e.clientX,e.clientY);
  if(dragging){
    dragging.x=p.x;
    dragging.y=p.y;
  }
  if(arrowTemp){
    arrowTemp.x2=p.x;
    arrowTemp.y2=p.y;
  }
};

canvas.onmouseup=()=>{
  dragging=null;
  arrowTemp=null;
};

canvas.onwheel=e=>{
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(0.3,scale),3);
};

/* ================== ANIMACIÓN ================== */
function animate(){
  arrows.forEach(a=>{
    let t=0;
    const i=setInterval(()=>{
      t+=0.02;
      objects.forEach(o=>{
        if(Math.hypot(o.x-a.x1,o.y-a.y1)<15){
          o.x=a.x1+(a.x2-a.x1)*t;
          o.y=a.y1+(a.y2-a.y1)*t;
        }
      });
      if(t>=1) clearInterval(i);
    },16);
  });
}

/* ================== GUARDADO ================== */
function savePlay(){
  localStorage.setItem("futsalPlay",JSON.stringify({objects,arrows}));
}

function loadPlay(){
  const d=JSON.parse(localStorage.getItem("futsalPlay"));
  if(!d) return;
  objects.length=0;
  arrows.length=0;
  d.objects.forEach(o=>objects.push(o));
  d.arrows.forEach(a=>arrows.push(a));
}
</script>
</body>
</html>
