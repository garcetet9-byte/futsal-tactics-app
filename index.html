<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚽ Futsal Tactics Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    background:#121212;
    color:#fff;
    height:100vh;
    display:flex;
}

.container{
    display:flex;
    width:100%;
    padding:10px;
    gap:10px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#1e1e1e;
    border-radius:10px;
    padding:10px;
}

.header{
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:15px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{font-size:22px}

.toolbar{
    display:flex;
    gap:10px;
    background:#2a2a2a;
    padding:10px;
    border-radius:8px;
}

.toolbar button{
    background:#667eea;
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

.toolbar button.active{background:#764ba2}

#canvas{
    flex:1;
    background:#1f7a1f;
    border-radius:10px;
}

.sidebar{
    width:280px;
    background:#1e1e1e;
    border-radius:10px;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.section{
    background:#2a2a2a;
    border-radius:8px;
    padding:12px;
}

.section h3{
    font-size:13px;
    margin-bottom:10px;
    color:#bbb;
}

.section button{
    width:100%;
    margin-bottom:6px;
    padding:8px;
    background:#667eea;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

.player-item{
    background:#3a3a3a;
    padding:6px;
    border-radius:6px;
    font-size:12px;
    margin-bottom:5px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal.active{display:flex}

.modal-content{
    background:#1e1e1e;
    padding:20px;
    border-radius:10px;
    width:300px;
}

.modal-content input,select{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
    border-radius:6px;
}

.modal-content button{
    width:100%;
    padding:10px;
    background:#667eea;
    border:none;
    border-radius:6px;
    color:white;
}
</style>
</head>

<body>
<div class="container">

<div class="main">
    <div class="header">
        <h1>⚽ Futsal Tactics Pro</h1>
        <input id="playName" placeholder="Nombre de la jugada"
        style="padding:6px;border-radius:6px;border:none"/>
    </div>

    <div class="toolbar">
        <button id="toolSelect" class="active">Seleccionar</button>
        <button id="toolArrow">Flecha</button>
        <button id="toolLine">Línea</button>
        <button id="clearBtn" style="background:#ff6b6b">Limpiar</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<div class="sidebar">
    <div class="section">
        <h3>👥 Jugadores</h3>
        <button id="addPlayerBtn">+ Agregar jugador</button>
        <div id="playerList"></div>
    </div>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="playerModal">
<div class="modal-content">
    <input id="pNumber" type="number" placeholder="Número">
    <select id="pRole">
        <option value="arquero">Arquero</option>
        <option value="jugador">Jugador</option>
    </select>
    <select id="pTeam">
        <option value="A">Equipo A</option>
        <option value="B">Equipo B</option>
    </select>
    <button id="addConfirm">Agregar</button>
</div>
</div>

<script>
const Data={
    play:{players:[],arrows:[],lines:[]},
    createPlayer(num,role,team){
        return{
            id:Date.now()+Math.random(),
            number:num,
            role,
            team,
            x:20,
            y:10,
            color:team==="A"?"#4ECDC4":"#FF6B6B"
        }
    }
}

const Canvas={
    el:document.getElementById("canvas"),
    ctx:null,
    rw:40,rh:20,
    init(){
        this.ctx=this.el.getContext("2d");
        this.resize();
        window.addEventListener("resize",()=>this.resize());
    },
    resize(){
        this.el.width=this.el.clientWidth;
        this.el.height=this.el.clientHeight;
    },
    rt(x,y){
        const p=20;
        return{
            x:p+x*(this.el.width-40)/this.rw,
            y:p+y*(this.el.height-40)/this.rh
        }
    },
    drawField(){
        const c=this.ctx;
        c.fillStyle="#1f7a1f";
        c.fillRect(0,0,this.el.width,this.el.height);
        c.strokeStyle="#fff";
        c.lineWidth=2;
        c.strokeRect(20,20,this.el.width-40,this.el.height-40);
    },

    // ✅ JUGADOR HUMANO (VISTA AÉREA)
    drawPlayer(p){
        const pos=this.rt(p.x,p.y);
        const c=this.ctx;
        const size=22;

        c.save();

        // sombra
        c.shadowColor="rgba(0,0,0,.4)";
        c.shadowBlur=6;
        c.shadowOffsetY=3;

        // cuerpo
        c.fillStyle=p.color;
        c.beginPath();
        c.roundRect(pos.x-size/2,pos.y-size/4,size,size,6);
        c.fill();

        // cabeza
        c.shadowBlur=0;
        c.fillStyle="#f1c27d";
        c.beginPath();
        c.arc(pos.x,pos.y-size/2.3,size/3,0,Math.PI*2);
        c.fill();

        // numero
        c.fillStyle="#fff";
        c.font="bold 11px Arial";
        c.textAlign="center";
        c.fillText(p.number,pos.x,pos.y+2);

        c.restore();
    },

    render(){
        this.drawField();
        Data.play.players.forEach(p=>this.drawPlayer(p));
    }
}

const UI={
    init(){
        Canvas.init();
        this.loop();

        toolSelect.onclick=()=>setTool("select");
        toolArrow.onclick=()=>setTool("arrow");
        toolLine.onclick=()=>setTool("line");

        clearBtn.onclick=()=>{
            Data.play.players=[];
        }

        addPlayerBtn.onclick=()=>{
            playerModal.classList.add("active");
        }

        addConfirm.onclick=()=>{
            Data.play.players.push(
                Data.createPlayer(
                    pNumber.value,
                    pRole.value,
                    pTeam.value
                )
            );
            playerModal.classList.remove("active");
            this.updateList();
        }
    },
    updateList(){
        playerList.innerHTML="";
        Data.play.players.forEach(p=>{
            const d=document.createElement("div");
            d.className="player-item";
            d.textContent="#"+p.number+" "+p.role;
            d.style.borderLeft="4px solid "+p.color;
            playerList.appendChild(d);
        });
    },
    loop(){
        Canvas.render();
        requestAnimationFrame(()=>this.loop());
    }
}

function setTool(t){
    document.querySelectorAll(".toolbar button").forEach(b=>b.classList.remove("active"));
    document.getElementById("tool"+t.charAt(0).toUpperCase()+t.slice(1)).classList.add("active");
}

UI.init();
</script>
</body>
</html>
