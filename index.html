<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pizarra Futsal Pro</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0f172a;
  font-family:Arial, Helvetica, sans-serif;
}

#toolbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:#111827;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px;
  z-index:10;
}

#toolbar button{
  background:#e5e7eb;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  font-weight:bold;
  cursor:pointer;
}

#toolbar button.active{
  background:#22c55e;
  color:white;
}

canvas{
  position:absolute;
  top:60px;
  left:0;
}
</style>
</head>

<body>

<div id="toolbar">
  <button onclick="setMode('select',this)">Seleccionar</button>
  <button onclick="setMode('player',this)">+ Jugador</button>
  <button onclick="setMode('goalie',this)">+ Arquero</button>
  <button onclick="setMode('cone',this)">+ Cono</button>
  <button onclick="setMode('ball',this)">⚽ Pelota</button>
  <button onclick="setMode('arrow',this)">➝ Flecha</button>
  <button onclick="deleteSelected()">🗑 Borrar</button>
  <button onclick="animatePlay()">▶ Animar</button>
  <button onclick="saveState()">💾 Guardar</button>
  <button onclick="loadState()">📂 Cargar</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 60;
}
resize();
window.addEventListener("resize", resize);

let mode="select";
let objects=[];
let arrows=[];
let dragging=null;
let selected=null;
let arrowStart=null;

/* ================= CANCHA ================= */
function drawField(){
  ctx.fillStyle="#166534";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.strokeRect(80,50,canvas.width-160,canvas.height-100);

  ctx.beginPath();
  ctx.moveTo(canvas.width/2,50);
  ctx.lineTo(canvas.width/2,canvas.height-50);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,70,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeRect(60,canvas.height/2-90,20,180);
  ctx.strokeRect(canvas.width-80,canvas.height/2-90,20,180);
}

/* ================= DIBUJOS ================= */
function drawPlayer(o){
  ctx.strokeStyle=o.color;
  ctx.fillStyle=o.color;
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.arc(o.x,o.y-12,7,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(o.x,o.y-4);
  ctx.lineTo(o.x,o.y+14);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(o.x,o.y+2);
  ctx.lineTo(o.x-8,o.y+10);
  ctx.moveTo(o.x,o.y+2);
  ctx.lineTo(o.x+8,o.y+10);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(o.x,o.y+14);
  ctx.lineTo(o.x-6,o.y+26);
  ctx.moveTo(o.x,o.y+14);
  ctx.lineTo(o.x+6,o.y+26);
  ctx.stroke();

  if(o.type==="goalie"){
    ctx.strokeStyle="yellow";
    ctx.lineWidth=2;
    ctx.strokeRect(o.x-16,o.y-22,32,50);
  }

  ctx.fillStyle="white";
  ctx.font="12px Arial";
  ctx.textAlign="center";
  ctx.fillText(o.name,o.x,o.y+40);

  if(o===selected){
    ctx.strokeStyle="yellow";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(o.x,o.y,30,0,Math.PI*2);
    ctx.stroke();
  }
}

function drawBall(o){
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(o.x,o.y,7,0,Math.PI*2);
  ctx.fill();
}

function drawObjects(){
  objects.forEach(o=>{
    if(o.type==="player"||o.type==="goalie") drawPlayer(o);
    if(o.type==="cone"){
      ctx.fillStyle="orange";
      ctx.beginPath();
      ctx.moveTo(o.x,o.y);
      ctx.lineTo(o.x-10,o.y+22);
      ctx.lineTo(o.x+10,o.y+22);
      ctx.fill();
    }
    if(o.type==="ball") drawBall(o);
  });
}

function drawArrows(){
  arrows.forEach(a=>{
    ctx.strokeStyle = a===selected ? "yellow" : "red";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(a.from.x,a.from.y);
    ctx.lineTo(a.to.x,a.to.y);
    ctx.stroke();
  });
}

/* ================= RENDER ================= */
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawField();
  drawArrows();
  drawObjects();
  requestAnimationFrame(render);
}
render();

/* ================= EVENTOS ================= */
canvas.addEventListener("mousedown",e=>{
  const x=e.offsetX,y=e.offsetY;
  selected=null;
  dragging=null;

  if(mode==="player"||mode==="goalie"){
    const name=prompt("Nombre:");
    if(!name) return;
    objects.push({
      type:mode,
      x,y,
      name,
      color: mode==="goalie"?"#fde047":"#2563eb"
    });
    return;
  }

  if(mode==="cone"){objects.push({type:"cone",x,y});return;}
  if(mode==="ball"){objects.push({type:"ball",x,y});return;}

  if(mode==="arrow"){
    objects.forEach(o=>{
      if(Math.hypot(o.x-x,o.y-y)<20){
        arrowStart=o;
        const a={from:o,to:{x,y}};
        arrows.push(a);
        selected=a;
      }
    });
    return;
  }

  objects.forEach(o=>{
    if(Math.hypot(o.x-x,o.y-y)<20){
      dragging=o;
      selected=o;
    }
  });

  arrows.forEach(a=>{
    const d=Math.abs((a.to.y-a.from.y)*x-(a.to.x-a.from.x)*y+a.to.x*a.from.y-a.to.y*a.from.x)/
      Math.hypot(a.to.y-a.from.y,a.to.x-a.from.x);
    if(d<6) selected=a;
  });
});

canvas.addEventListener("mousemove",e=>{
  const x=e.offsetX,y=e.offsetY;
  if(dragging){dragging.x=x;dragging.y=y;}
  if(arrowStart){arrows[arrows.length-1].to={x,y};}
});

canvas.addEventListener("mouseup",()=>{dragging=null;arrowStart=null;});

/* ================= BOTONES ================= */
function deleteSelected(){
  if(!selected) return;
  objects = objects.filter(o=>o!==selected);
  arrows = arrows.filter(a=>a!==selected);
  selected=null;
}

function animatePlay(){
  arrows.forEach(a=>{
    const o=a.from,t=a.to;
    const i=setInterval(()=>{
      o.x+=(t.x-o.x)*0.15;
      o.y+=(t.y-o.y)*0.15;
      if(Math.hypot(o.x-t.x,o.y-t.y)<1) clearInterval(i);
    },16);
  });
}

function saveState(){
  localStorage.setItem("futsalPro",JSON.stringify({objects,arrows}));
  alert("Jugada guardada");
}

function loadState(){
  const d=JSON.parse(localStorage.getItem("futsalPro"));
  if(d){
    objects=d.objects||[];
    arrows=d.arrows||[];
    alert("Jugada cargada");
  }
}

function setMode(m,btn){
  mode=m;
  document.querySelectorAll("#toolbar button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}
</script>

</body>
</html>
