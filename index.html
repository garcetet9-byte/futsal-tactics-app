<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Futsal Tactics Pro</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0f172a;
  font-family:Arial, Helvetica, sans-serif;
}

#toolbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:#111827;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px;
  z-index:10;
}

#toolbar button{
  background:#e5e7eb;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  font-weight:bold;
  cursor:pointer;
}

#toolbar button.active{
  background:#22c55e;
  color:white;
}

canvas{
  position:absolute;
  top:60px;
  left:0;
}
</style>
</head>

<body>

<div id="toolbar">
  <button onclick="setMode('select',this)">Seleccionar</button>
  <button onclick="setMode('player',this)">+ Jugador</button>
  <button onclick="setMode('goalie',this)">+ Arquero</button>
  <button onclick="setMode('cone',this)">+ Cono</button>
  <button onclick="setMode('ball',this)">⚽ Pelota</button>
  <button onclick="setMode('arrow',this)">➝ Flecha</button>
  <button onclick="deleteArrow()">🗑 Flecha</button>
  <button onclick="toggleTactic()">🧠 Of/Def</button>
  <button onclick="animatePlay()">▶ Animar</button>
  <button onclick="saveState()">💾 Guardar</button>
  <button onclick="loadState()">📂 Cargar</button>
  <button onclick="setTeam('A',this)">Equipo A</button>
  <button onclick="setTeam('B',this)">Equipo B</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 60;
}
resize();
window.addEventListener("resize", resize);

/* ===== ESTADO ===== */
let mode = "select";
let team = "A";
let tactic = "offensive";

let objects = [];
let arrows = [];

let dragging = null;
let selectedArrow = null;
let arrowStartObject = null;

/* ===== MODOS ===== */
function setMode(m,btn){
  mode = m;
  document.querySelectorAll("#toolbar button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}

function setTeam(t,btn){
  team = t;
  document.querySelectorAll("#toolbar button").forEach(b=>{
    if(b.textContent.includes("Equipo")) b.classList.remove("active");
  });
  if(btn) btn.classList.add("active");
}

/* ===== CANCHA ===== */
function drawField(){
  ctx.fillStyle="#166534";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="white";
  ctx.lineWidth=3;

  ctx.strokeRect(100,50,canvas.width-200,canvas.height-100);

  ctx.beginPath();
  ctx.moveTo(canvas.width/2,50);
  ctx.lineTo(canvas.width/2,canvas.height-50);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,70,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeRect(80,canvas.height/2-100,20,200);
  ctx.strokeRect(canvas.width-100,canvas.height/2-100,20,200);
}

/* ===== PERSONITA ===== */
function drawPlayer(o){
  // Cabeza
  ctx.fillStyle=o.color;
  ctx.beginPath();
  ctx.arc(o.x,o.y-8,6,0,Math.PI*2);
  ctx.fill();

  // Cuerpo
  ctx.strokeStyle=o.color;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(o.x,o.y-2);
  ctx.lineTo(o.x,o.y+12);
  ctx.stroke();

  // Piernas
  ctx.beginPath();
  ctx.moveTo(o.x,o.y+12);
  ctx.lineTo(o.x-6,o.y+22);
  ctx.moveTo(o.x,o.y+12);
  ctx.lineTo(o.x+6,o.y+22);
  ctx.stroke();

  // Nombre
  ctx.fillStyle="white";
  ctx.font="12px Arial";
  ctx.textAlign="center";
  ctx.fillText(o.name,o.x,o.y+36);

  // Arquero distinto
  if(o.type==="goalie"){
    ctx.strokeStyle="yellow";
    ctx.lineWidth=2;
    ctx.strokeRect(o.x-14,o.y-20,28,40);
  }
}

/* ===== OBJETOS ===== */
function drawObjects(){
  objects.forEach(o=>{
    if(o.type==="player"||o.type==="goalie") drawPlayer(o);

    if(o.type==="cone"){
      ctx.fillStyle="orange";
      ctx.beginPath();
      ctx.moveTo(o.x,o.y);
      ctx.lineTo(o.x-10,o.y+20);
      ctx.lineTo(o.x+10,o.y+20);
      ctx.fill();
    }

    if(o.type==="ball"){
      ctx.fillStyle="white";
      ctx.beginPath();
      ctx.arc(o.x,o.y,6,0,Math.PI*2);
      ctx.fill();
    }
  });
}

/* ===== FLECHAS ===== */
function drawArrows(){
  arrows.forEach(a=>{
    ctx.strokeStyle = a===selectedArrow ? "yellow" : (tactic==="offensive"?"red":"blue");
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(a.from.x,a.from.y);
    ctx.lineTo(a.to.x,a.to.y);
    ctx.stroke();
  });
}

/* ===== RENDER ===== */
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawField();
  drawArrows();
  drawObjects();
  requestAnimationFrame(render);
}
render();

/* ===== EVENTOS ===== */
canvas.addEventListener("mousedown", e=>{
  const x=e.offsetX, y=e.offsetY;
  dragging=null;
  selectedArrow=null;

  if(mode==="player"||mode==="goalie"){
    const name = prompt("Nombre:");
    if(!name) return;
    const color = team==="A"?"#2563eb":"#dc2626";
    objects.push({type:mode,x,y,name,color});
    return;
  }

  if(mode==="cone"){ objects.push({type:"cone",x,y}); return; }
  if(mode==="ball"){ objects.push({type:"ball",x,y}); return; }

  if(mode==="arrow"){
    objects.forEach(o=>{
      if(Math.hypot(o.x-x,o.y-y)<20){
        arrowStartObject=o;
        arrows.push({from:o,to:{x,y}});
      }
    });
    return;
  }

  objects.forEach(o=>{
    if(Math.hypot(o.x-x,o.y-y)<20) dragging=o;
  });

  arrows.forEach(a=>{
    if(Math.hypot(a.to.x-x,a.to.y-y)<10) selectedArrow=a;
  });
});

canvas.addEventListener("mousemove", e=>{
  const x=e.offsetX, y=e.offsetY;
  if(dragging){ dragging.x=x; dragging.y=y; }
  if(arrowStartObject){
    arrows[arrows.length-1].to={x,y};
  }
});

canvas.addEventListener("mouseup",()=>{
  dragging=null;
  arrowStartObject=null;
});

/* DOBLE CLICK → EDITAR NOMBRE */
canvas.addEventListener("dblclick", e=>{
  const x=e.offsetX, y=e.offsetY;
  objects.forEach(o=>{
    if((o.type==="player"||o.type==="goalie") &&
       Math.hypot(o.x-x,o.y-y)<20){
      const n = prompt("Editar nombre:", o.name);
      if(n) o.name=n;
    }
  });
});

/* ===== ACCIONES ===== */
function deleteArrow(){
  if(selectedArrow){
    arrows = arrows.filter(a=>a!==selectedArrow);
    selectedArrow=null;
  }
}

function toggleTactic(){
  tactic = tactic==="offensive"?"defensive":"offensive";
}

function animatePlay(){
  arrows.forEach(a=>{
    const o=a.from, t=a.to;
    const i=setInterval(()=>{
      o.x += (t.x-o.x)*0.1;
      o.y += (t.y-o.y)*0.1;
      if(Math.hypot(o.x-t.x,o.y-t.y)<1) clearInterval(i);
    },16);
  });
}

function saveState(){
  localStorage.setItem("futsalPro",JSON.stringify({objects,arrows}));
}

function loadState(){
  const d=JSON.parse(localStorage.getItem("futsalPro"));
  if(d){ objects=d.objects; arrows=d.arrows; }
}
</script>

</body>
</html>
