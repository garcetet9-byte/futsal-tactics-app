<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Futsal Tactics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            gap: 10px;
            padding: 10px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .toolbar button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: #5568d3;
        }

        .toolbar button.active {
            background: #764ba2;
        }

        #canvas {
            flex: 1;
            background: #2D5016;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: crosshair;
        }

        .sidebar {
            width: 300px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .section {
            background: #333;
            border-radius: 8px;
            padding: 15px;
        }

        .section h3 {
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #aaa;
            font-weight: bold;
        }

        .section button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .section button:hover {
            background: #5568d3;
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }

        .player-item {
            background: #444;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid #667eea;
        }

        .player-item:hover {
            background: #555;
        }

        .plays-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
        }

        .play-item {
            background: #444;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .play-item:hover {
            background: #555;
        }

        .play-item.active {
            background: #667eea;
            border-left: 3px solid #764ba2;
        }

        .play-item-buttons {
            display: flex;
            gap: 4px;
        }

        .play-item-buttons button {
            background: #667eea !important;
            padding: 4px 8px !important;
            font-size: 11px !important;
            width: auto !important;
            margin: 0 !important;
        }

        .time-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        .time-display .big {
            font-size: 28px;
            font-weight: bold;
        }

        .time-display .small {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        input[type="text"] {
            background: #444;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            width: 100%;
            margin-bottom: 8px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border: 2px solid #667eea;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #fff;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .modal-content textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-actions button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .modal-actions button:hover {
            background: #5568d3;
        }

        .modal-actions button.cancel {
            background: #666;
        }

        .modal-actions button.cancel:hover {
            background: #777;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .message.success {
            border-left-color: #51cf66;
        }

        .message.error {
            border-left-color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MAIN AREA -->
        <div class="main">
            <!-- HEADER -->
            <div class="header">
                <h1>⚽ Futsal Tactics</h1>
                <div class="header-actions">
                    <input type="text" id="playName" placeholder="Nombre de la jugada..." style="width: 250px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 12px;">
                    <button id="exportBtn" style="background: #51cf66;">📥 Exportar PNG</button>
                </div>
            </div>

            <!-- TOOLBAR -->
            <div class="toolbar">
                <button id="toolSelect" class="active">Seleccionar</button>
                <button id="toolArrow">Flecha (→)</button>
                <button id="toolLine">Línea (--)</button>
                <button id="undoBtn">↶ Deshacer</button>
                <button id="clearBtn" style="background: #ff6b6b;">🗑 Limpiar</button>
            </div>

            <!-- CANVAS -->
            <canvas id="canvas"></canvas>

            <!-- PLAYBACK CONTROLS -->
            <div class="toolbar">
                <button id="playBtn">▶ Play</button>
                <button id="pauseBtn">⏸ Pausa</button>
                <button id="stopBtn">⏹ Stop</button>
                <button id="stepBtn">➜ Paso</button>
                <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" style="width: 150px; height: 30px;">
                <span id="speedLabel" style="min-width: 40px;">1x</span>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <!-- FORMACION -->
            <div class="section">
                <h3>📊 Formación</h3>
                <button data-formation="3-1">3-1</button>
                <button data-formation="4-0">4-0</button>
                <button data-formation="2-2">2-2</button>
            </div>

            <!-- TIME -->
            <div class="time-display">
                <div class="big" id="timeDisplay">00:00.0</div>
                <div class="small" id="timeInfo">Duración: 0.0s</div>
            </div>

            <!-- JUGADORES -->
            <div class="section">
                <h3>👥 Jugadores</h3>
                <button id="addPlayerBtn">+ Agregar Jugador</button>
                <div class="player-list" id="playerList"></div>
            </div>

            <!-- JUGADAS -->
            <div class="section">
                <h3>📋 Mis Jugadas</h3>
                <button id="saveBtn" style="background: #51cf66;">💾 Guardar</button>
                <div class="plays-list" id="playsList"></div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal" id="addPlayerModal">
        <div class="modal-content">
            <h2>Agregar Jugador</h2>
            <input type="number" id="playerNumber" placeholder="Número (1-5)" min="1" max="5">
            <select id="playerRole">
                <option value="arquero">🧤 Arquero</option>
                <option value="cierre">🛡️ Cierre</option>
                <option value="ala_izq">⬅️ Ala Izquierda</option>
                <option value="ala_der">➡️ Ala Derecha</option>
                <option value="pivot">🎯 Pívot</option>
            </select>
            <select id="playerTeam">
                <option value="A">Equipo A (Azul)</option>
                <option value="B">Equipo B (Rojo)</option>
            </select>
            <input type="number" id="playerX" placeholder="X (0-40)" min="0" max="40" step="0.5" value="20">
            <input type="number" id="playerY" placeholder="Y (0-20)" min="0" max="20" step="0.5" value="10">
            <div class="modal-actions">
                <button class="cancel" onclick="document.getElementById('addPlayerModal').classList.remove('active')">Cancelar</button>
                <button id="confirmPlayerBtn">Agregar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="newPlayModal">
        <div class="modal-content">
            <h2>Nueva Jugada</h2>
            <input type="text" id="newPlayName" placeholder="Nombre de la jugada...">
            <select id="newPlayFormation">
                <option value="3-1">3-1</option>
                <option value="4-0">4-0</option>
                <option value="2-2">2-2</option>
            </select>
            <textarea id="newPlayDesc" placeholder="Descripción..."></textarea>
            <div class="modal-actions">
                <button class="cancel" onclick="document.getElementById('newPlayModal').classList.remove('active')">Cancelar</button>
                <button id="confirmNewPlayBtn">Crear</button>
            </div>
        </div>
    </div>

    <script>
        // =============== DATA MODEL ===============
        const Data = {
            currentPlay: null,
            history: [],

            createPlay(name) {
                return {
                    id: `play-${Date.now()}`,
                    name: name || 'Nueva Jugada',
                    formation: '3-1',
                    players: [],
                    arrows: [],
                    lines: [],
                    createdAt: new Date().toISOString()
                };
            },

            createPlayer(number, role, team, x, y) {
                const colors = { A: '#4ECDC4', B: '#FF6B6B' };
                return {
                    id: `p-${Date.now()}`,
                    number,
                    role,
                    team,
                    x,
                    y,
                    color: colors[team]
                };
            },

            save() {
                let plays = JSON.parse(localStorage.getItem('futsal_plays') || '[]');
                const idx = plays.findIndex(p => p.id === this.currentPlay.id);
                if (idx >= 0) plays[idx] = this.currentPlay;
                else plays.push(this.currentPlay);
                localStorage.setItem('futsal_plays', JSON.stringify(plays));
            },

            load(id) {
                const plays = JSON.parse(localStorage.getItem('futsal_plays') || '[]');
                return plays.find(p => p.id === id);
            },

            loadAll() {
                return JSON.parse(localStorage.getItem('futsal_plays') || '[]');
            }
        };

        // =============== CANVAS SYSTEM ===============
        const Canvas = {
            canvas: document.getElementById('canvas'),
            ctx: document.getElementById('canvas').getContext('2d'),
            realWidth: 40,
            realHeight: 20,

            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            },

            realToCanvas(x, y) {
                const px = 20;
                const scaleX = (this.canvas.width - px * 2) / this.realWidth;
                const scaleY = (this.canvas.height - px * 2) / this.realHeight;
                return {
                    x: px + x * scaleX,
                    y: px + y * scaleY
                };
            },

            canvasToReal(canvasX, canvasY) {
                const px = 20;
                const scaleX = (this.canvas.width - px * 2) / this.realWidth;
                const scaleY = (this.canvas.height - px * 2) / this.realHeight;
                return {
                    x: (canvasX - px) / scaleX,
                    y: (canvasY - px) / scaleY
                };
            },

            drawField() {
                const ctx = this.ctx;
                ctx.fillStyle = '#2D5016';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const bounds = { x: 20, y: 20, w: this.canvas.width - 40, h: this.canvas.height - 40 };

                // Border
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);

                // Center line
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(bounds.x + bounds.w / 2, bounds.y);
                ctx.lineTo(bounds.x + bounds.w / 2, bounds.y + bounds.h);
                ctx.stroke();
                ctx.setLineDash([]);

                // Center circle
                ctx.beginPath();
                ctx.arc(bounds.x + bounds.w / 2, bounds.y + bounds.h / 2, 20, 0, Math.PI * 2);
                ctx.stroke();

                // Goal areas
                const gaWidth = bounds.w * 0.15;
                const gaHeight = bounds.h * 0.6;
                const gaY = bounds.y + (bounds.h - gaHeight) / 2;
                ctx.strokeRect(bounds.x, gaY, gaWidth, gaHeight);
                ctx.strokeRect(bounds.x + bounds.w - gaWidth, gaY, gaWidth, gaHeight);
            },

            drawPlayer(player) {
                const pos = this.realToCanvas(player.x, player.y);
                const ctx = this.ctx;

                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(player.number, pos.x, pos.y);
            },

            drawArrow(from, to, color = '#FFD93D') {
                const f = this.realToCanvas(from.x, from.y);
                const t = this.realToCanvas(to.x, to.y);
                const ctx = this.ctx;

                const headlen = 15;
                const angle = Math.atan2(t.y - f.y, t.x - f.x);

                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(t.x, t.y);
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(t.x, t.y);
                ctx.lineTo(t.x - headlen * Math.cos(angle - Math.PI / 6), t.y - headlen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(t.x - headlen * Math.cos(angle + Math.PI / 6), t.y - headlen * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            },

            drawLine(from, to, color = '#95E1D3') {
                const f = this.realToCanvas(from.x, from.y);
                const t = this.realToCanvas(to.x, to.y);
                const ctx = this.ctx;

                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(t.x, t.y);
                ctx.stroke();
                ctx.setLineDash([]);
            },

            render(play) {
                this.drawField();
                if (!play) return;

                play.lines.forEach(l => this.drawLine(l.from, l.to));
                play.arrows.forEach(a => this.drawArrow(a.from, a.to));
                play.players.forEach(p => this.drawPlayer(p));
            }
        };

        // =============== INTERACTION ===============
        const Interact = {
            tool: 'select',
            draggingPlayer: null,
            tempArrow: null,
            tempLine: null,

            init() {
                Canvas.canvas.addEventListener('mousedown', e => this.mouseDown(e));
                Canvas.canvas.addEventListener('mousemove', e => this.mouseMove(e));
                Canvas.canvas.addEventListener('mouseup', e => this.mouseUp(e));
            },

            getPos(e) {
                const rect = Canvas.canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            },

            mouseDown(e) {
                const pos = this.getPos(e);
                const realPos = Canvas.canvasToReal(pos.x, pos.y);

                if (this.tool === 'select') {
                    for (let p of Data.currentPlay.players) {
                        const ppos = Canvas.realToCanvas(p.x, p.y);
                        const dist = Math.sqrt((pos.x - ppos.x) ** 2 + (pos.y - ppos.y) ** 2);
                        if (dist < 15) {
                            this.draggingPlayer = p;
                            break;
                        }
                    }
                } else if (this.tool === 'arrow') {
                    this.tempArrow = { from: realPos, to: realPos };
                } else if (this.tool === 'line') {
                    this.tempLine = { from: realPos, to: realPos };
                }
            },

            mouseMove(e) {
                const pos = this.getPos(e);
                const realPos = Canvas.canvasToReal(pos.x, pos.y);

                if (this.draggingPlayer) {
                    this.draggingPlayer.x = Math.max(0, Math.min(40, realPos.x));
                    this.draggingPlayer.y = Math.max(0, Math.min(20, realPos.y));
                } else if (this.tempArrow) {
                    this.tempArrow.to = realPos;
                } else if (this.tempLine) {
                    this.tempLine.to = realPos;
                }
            },

            mouseUp(e) {
                if (this.tempArrow) {
                    Data.currentPlay.arrows.push(this.tempArrow);
                    this.tempArrow = null;
                }
                if (this.tempLine) {
                    Data.currentPlay.lines.push(this.tempLine);
                    this.tempLine = null;
                }
                this.draggingPlayer = null;
            }
        };

        // =============== UI CONTROLLER ===============
        const UI = {
            init() {
                // Load or create first play
                let plays = Data.loadAll();
                if (plays.length === 0) {
                    Data.currentPlay = Data.createPlay('Mi Primera Jugada');
                } else {
                    Data.currentPlay = plays[0];
                }

                // Setup tools
                document.getElementById('toolSelect').addEventListener('click', e => {
                    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    Interact.tool = 'select';
                });

                document.getElementById('toolArrow').addEventListener('click', e => {
                    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    Interact.tool = 'arrow';
                });

                document.getElementById('toolLine').addEventListener('click', e => {
                    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    Interact.tool = 'line';
                });

                // Formation buttons
                document.querySelectorAll('[data-formation]').forEach(btn => {
                    btn.addEventListener('click', e => {
                        Data.currentPlay.formation = e.target.dataset.formation;
                        this.showMessage('Formación: ' + e.target.dataset.formation);
                    });
                });

                // Players
                document.getElementById('addPlayerBtn').addEventListener('click', () => {
                    document.getElementById('addPlayerModal').classList.add('active');
                });

                document.getElementById('confirmPlayerBtn').addEventListener('click', () => {
                    const number = parseInt(document.getElementById('playerNumber').value);
                    const role = document.getElementById('playerRole').value;
                    const team = document.getElementById('playerTeam').value;
                    const x = parseFloat(document.getElementById('playerX').value);
                    const y = parseFloat(document.getElementById('playerY').value);

                    if (number && role && team) {
                        Data.currentPlay.players.push(Data.createPlayer(number, role, team, x, y));
                        this.updatePlayerList();
                        this.showMessage('Jugador agregado');
                        document.getElementById('addPlayerModal').classList.remove('active');
                    }
                });

                // Save
                document.getElementById('saveBtn').addEventListener('click', () => {
                    const name = document.getElementById('playName').value || 'Jugada sin nombre';
                    Data.currentPlay.name = name;
                    Data.save();
                    this.updatePlaysList();
                    this.showMessage('Jugada guardada', 'success');
                });

                // Clear
                document.getElementById('clearBtn').addEventListener('click', () => {
                    if (confirm('¿Limpiar la cancha?')) {
                        Data.currentPlay.arrows = [];
                        Data.currentPlay.lines = [];
                        Data.currentPlay.players = [];
                        this.updatePlayerList();
                    }
                });

                // Export
                document.getElementById('exportBtn').addEventListener('click', () => {
                    const link = document.createElement('a');
                    link.href = Canvas.canvas.toDataURL('image/png');
                    link.download = `futsal-${Data.currentPlay.name}-${Date.now()}.png`;
                    link.click();
                    this.showMessage('Exportado', 'success');
                });

                // Speed
                document.getElementById('speed').addEventListener('input', e => {
                    document.getElementById('speedLabel').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
                });

                // Render loop
                this.render();

                Canvas.init();
                Interact.init();
                this.updatePlayerList();
                this.updatePlaysList();
                document.getElementById('playName').value = Data.currentPlay.name;
            },

            render() {
                Canvas.render(Data.currentPlay);
                if (Interact.tempArrow) Canvas.drawArrow(Interact.tempArrow.from, Interact.tempArrow.to);
                if (Interact.tempLine) Canvas.drawLine(Interact.tempLine.from, Interact.tempLine.to);
                requestAnimationFrame(() => this.render());
            },

            updatePlayerList() {
                const list = document.getElementById('playerList');
                list.innerHTML = '';
                Data.currentPlay.players.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'player-item';
                    div.textContent = `#${p.number} - ${p.role} (${p.x.toFixed(1)}, ${p.y.toFixed(1)})`;
                    div.style.borderLeftColor = p.color;
                    list.appendChild(div);
                });
            },

            updatePlaysList() {
                const list = document.getElementById('playsList');
                list.innerHTML = '';
                const plays = Data.loadAll();
                plays.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'play-item' + (p.id === Data.currentPlay.id ? ' active' : '');
                    div.innerHTML = `
                        <div>${p.name}</div>
                        <div class="play-item-buttons">
                            <button onclick="loadPlay('${p.id}')">📂</button>
                            <button onclick="deletePlay('${p.id}')" style="background: #ff6b6b !important;">🗑</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

            showMessage(text, type = 'info') {
                const msg = document.createElement('div');
                msg.className = `message ${type}`;
                msg.textContent = text;
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 2000);
            }
        };

        // =============== GLOBAL FUNCTIONS ===============
        function loadPlay(id) {
            const play = Data.load(id);
            if (play) {
                Data.currentPlay = play;
                UI.updatePlayerList();
                UI.updatePlaysList();
                document.getElementById('playName').value = play.name;
                UI.showMessage('Jugada cargada');
            }
        }

        function deletePlay(id) {
            if (confirm('¿Eliminar esta jugada?')) {
                let plays = JSON.parse(localStorage.getItem('futsal_plays') || '[]');
                plays = plays.filter(p => p.id !== id);
                localStorage.setItem('futsal_plays', JSON.stringify(plays));
                UI.updatePlaysList();
                UI.showMessage('Jugada eliminada');
            }
        }

        // =============== INIT ===============
        UI.init();
    </script>
</body>
</html>
